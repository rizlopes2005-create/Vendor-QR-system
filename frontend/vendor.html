<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - Arun Bites</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="dashboard-header mb-4">
        <div class="container flex justify-between items-center p-2">
            <div>
                <h1 class="font-extrabold" style="font-size: 1.8rem;">Vendor Dashboard</h1>
                <p class="text-muted" style="font-size: 0.9rem; opacity: 1;">Manage your live orders and track sales</p>
            </div>
            <div id="connection-status" class="badge"
                style="background: #00B894; color: white; padding: 8px 16px; border-radius: 50px;">
                ● Live</div>
        </div>
    </header>

    <main class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="stats-orders">0</span>
                <span class="stat-label">Total Orders</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stats-sales">₹0</span>
                <span class="stat-label">Today's Sales</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="order-count-badge">0</span>
                <span class="stat-label">Pending</span>
            </div>
        </div>

        <h2 class="order-section-title">
            Incoming Orders
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
        </h2>

        <div id="vendor-order-list" class="status-grid">
            <!-- Orders will appear here in real-time -->
            <div style="grid-column: 1/-1; text-align: center; padding: 80px 20px;">
                <div class="spinner" style="margin: 0 auto 20px;"></div>
                <p style="color: var(--text-muted); font-weight: 600;">Connecting to order stream...</p>
            </div>
        </div>
    </main>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initVendorDashboard();
        });
    </script>
</body>

</html>
