<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Arun Bites</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container animate-fade-in h-screen-mobile flex flex-col items-center text-center">

        <div style="font-size: 5rem;" class="mb-2">✅</div>
        <h1 class="font-extrabold mb-1">Order Placed!</h1>
        <p class="text-muted mb-4">Your food is being prepared with love.</p>

        <div class="card w-full p-3 shadow-lg">
            <p style="font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;"
                class="text-muted">Your Token Number</p>
            <h2 style="font-size: 4rem; color: var(--primary); margin: 5px 0;" class="font-extrabold" id="order-token">
                --</h2>

            <!-- Progress Tracker -->
            <div class="tracker-container">
                <div class="tracker-line">
                    <div class="tracker-line-progress"></div>
                </div>
                <div class="tracker-step">
                    <div class="step-icon">🧾</div>
                    <span class="step-label">Ordered</span>
                </div>
                <div class="tracker-step">
                    <div class="step-icon">👨‍🍳</div>
                    <span class="step-label">Preparing</span>
                </div>
                <div class="tracker-step">
                    <div class="step-icon">✅</div>
                    <span class="step-label">Ready</span>
                </div>
            </div>

            <div class="mt-2" style="padding-top: 20px; border-top: 1px dashed #EEE;">
                <p style="font-weight: 600;">Status: <span id="order-status" class="badge badge-pending">Order
                        Received</span></p>
                <p style="font-size: 0.85rem; margin-top: 10px;" class="text-muted">Wait Time: <span id="wait-time">~10
                        mins</span></p>
            </div>
        </div>

        <button class="btn btn-secondary mt-2" onclick="window.location.href='menu.html'">
            Order More
        </button>

        <p class="mt-4 text-muted" style="font-size: 0.8rem;">
            Please show your token to the vendor when your status is <strong>READY</strong>.
        </p>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');
            if (orderId) {
                trackOrder(orderId);
            }
        });
    </script>
</body>

</html>
